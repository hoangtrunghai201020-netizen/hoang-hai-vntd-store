<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12"><title>HOÀNG HẢI VNTD — Digital Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{
 --bg:#060a10;
 --line:#203149;
 --cyan:#00e5ee;
 --muted:#91a0b5;
 --white:#f5f8fc;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--white);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background-image:linear-gradient(#060a10bb,#060a10dd),url("./banner.png.PNG");
 background-size:cover;
 background-position:center;
 background-attachment:fixed;
}
</head>
<body>
<header class="top"><div class="wrap nav"><div class="logo">HOÀNG HẢI VNTD<small>DIGITAL STORE</small></div><nav class="links"><button class="active" data-view="shop">Trang chủ</button><button data-view="orders">Đơn hàng</button><button data-view="account">Tài khoản</button><button data-view="admin">ADMIN</button><button id="cartBtn">Giỏ (<span id="cartCount">0</span>)</button></nav></div></header>
<main class="wrap">
<section id="shopView"><div class="hero"><div class="eyebrow">WELCOME TO OUR DIGITAL STORE</div><h1>SẢN PHẨM SỐ<br><span>NHANH • GỌN • TIỆN</span></h1><p>Khám phá sản phẩm số, xem tồn kho và gửi yêu cầu đặt hàng từ iPhone.</p><button class="btn primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Khám phá sản phẩm ↓</button></div><h2 id="catalog">Danh mục sản phẩm</h2><p class="muted">Sản phẩm được quản lý từ trang ADMIN.</p><div class="toolbar"><input class="field" id="search" placeholder="Tìm kiếm sản phẩm..."><select class="field" id="category"><option value="">Tất cả danh mục</option></select><select class="field" id="sort"><option value="new">Mới nhất</option><option value="low">Giá thấp → cao</option><option value="high">Giá cao → thấp</option></select></div><div class="grid" id="productGrid"></div></section>
<section id="ordersView" class="section hidden"><h2>Đơn hàng của tôi</h2><div id="myOrders" class="panel">Đăng nhập để xem đơn hàng.</div></section>
<section id="accountView" class="section hidden"><h2>Tài khoản khách hàng</h2><div class="panel"><div id="sessionInfo" class="muted">Chưa đăng nhập</div><div class="formgrid"><div><h3>Đăng ký</h3><div class="formrow"><label>Email</label><input id="signupEmail" type="email" autocomplete="email"></div><div class="formrow"><label>Mật khẩu (ít nhất 8 ký tự)</label><input id="signupPass" type="password" autocomplete="new-password"></div><button class="btn primary" id="signupBtn">Tạo tài khoản</button></div><div><h3>Đăng nhập</h3><div class="formrow"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="formrow"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Đăng nhập</button> <button class="btn" id="logoutBtn">Đăng xuất</button></div></div></div></section>
<section id="adminView" class="section hidden"><h2>Quản trị cửa hàng</h2><div class="notice">Chỉ tài khoản được cấp role ADMIN trong bảng profiles mới có quyền quản trị. Không đặt secret/service_role key trong mã HTML.</div><div class="panel"><div class="row"><h3>Thêm / sửa sản phẩm</h3><span class="muted" id="adminStatus">Đang kiểm tra quyền...</span></div><form id="productForm"><input type="hidden" id="editId"><div class="formgrid"><div class="formrow"><label>Tên sản phẩm</label><input id="pName" required maxlength="120"></div><div class="formrow"><label>Danh mục</label><input id="pCategory" required maxlength="60"></div><div class="formrow"><label>Giá (VND)</label><input id="pPrice" type="number" min="0" required></div><div class="formrow"><label>Số lượng tồn kho</label><input id="pStock" type="number" min="0" required></div><div class="formrow"><label>Mã SKU</label><input id="pSku" required maxlength="60"></div><div class="formrow"><label>Ảnh hoặc biểu tượng</label><input id="pIcon" value="✦" maxlength="300"></div></div><div class="formrow"><label>Mô tả</label><textarea id="pDesc" maxlength="1000"></textarea></div><button class="btn primary" type="submit">Lưu sản phẩm</button> <button class="btn" type="button" id="resetProduct">Xóa nội dung</button></form></div><div class="panel"><h3>Kho sản phẩm</h3><div class="tablewrap"><table><thead><tr><th>Sản phẩm / SKU</th><th>Giá</th><th>Tồn</th><th>Thao tác</th></tr></thead><tbody id="inventory"></tbody></table></div></div><div class="panel"><h3>Quản lý đơn hàng</h3><div class="tablewrap"><table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody id="allOrders"></tbody></table></div></div></section>
<div class="panel"><h3>Thanh toán</h3><p class="muted">Bản hiện tại chỉ ghi nhận đơn chờ thanh toán, chưa thu tiền thật. Tích hợp VNPay/MoMo/ZaloPay cần backend riêng để giữ bí mật khóa và xác minh webhook.</p></div>
</main><footer><div class="wrap">© <span id="year"></span> HOÀNG HẢI VNTD • Digital Store</div></footer>
<div class="modalbg" id="modalBg"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Giỏ hàng</h3><button class="btn small" id="modalClose">Đóng ✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
/* Supabase Project URL và publishable/anon key công khai; không dùng secret/service_role key tại đây. */
const SUPABASE_URL = "https://rocivogcpmtyejduvyva.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9tKr51GC0EObygn3aYS71A_ivI-EcT7";
const sb = window.supabase?.createClient ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
let products=[],cart=[],user=null,isAdmin=false;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat("vi-VN").format(Number(n)||0)+"₫";
function showProductIcon(value){
 const v=String(value||"✦").trim();
 if(/\.(png|jpg|jpeg|webp|gif)(\?.*)?$/i.test(v)){
  return `<img src="${esc(v)}" alt="Ảnh sản phẩm">`;
 }
 return esc(v);
}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2600)}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modalBg").classList.add("show")}
function closeModal(){$("modalBg").classList.remove("show")}
function showView(v){["shop","orders","account","admin"].forEach(x=>$(x+"View").classList.toggle("hidden",x!==v));document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="orders")loadMyOrders();if(v==="admin")loadAdmin()}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));
$("modalClose").onclick=closeModal;$("modalBg").onclick=e=>{if(e.target===$("modalBg"))closeModal()};
function render(){const q=$("search").value.trim().toLowerCase(),cat=$("category").value,sort=$("sort").value;let a=products.filter(p=>(p.name+" "+(p.description||"")).toLowerCase().includes(q)&&(!cat||p.category===cat));if(sort==="low")a.sort((x,y)=>x.price-y.price);if(sort==="high")a.sort((x,y)=>y.price-x.price);$("productGrid").innerHTML=a.length?a.map(p=>`<article class="card"><div class="art">${showProductIcon(p.icon)}</div><p class="tag">${esc(p.category)}</p><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||"")}</p><div class="price">${money(p.price)}</div><p class="muted">Còn ${Number(p.stock)||0} sản phẩm • SKU: ${esc(p.sku||"")}</p><button class="btn primary" ${p.stock<1?"disabled":""} onclick="addCart('${p.id}')">${p.stock<1?"Hết hàng":"Thêm vào giỏ"}</button></article>`).join(""):'<div class="card">Chưa có sản phẩm hoặc không có kết quả phù hợp.</div>';const old=cat;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];$("category").innerHTML='<option value="">Tất cả danh mục</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");$("category").value=cats.includes(old)?old:""}
async function loadProducts(){const {data,error}=await sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false});if(error){toast("Không tải được sản phẩm: "+error.message);products=[]}else products=data||[];render()}
function updateCartCount(){$("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0)}
function addCart(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return toast("Không tìm thấy sản phẩm");const found=cart.find(x=>String(x.id)===String(id));if((found?.qty||0)>=Number(p.stock))return toast("Số lượng vượt tồn kho");if(found)found.qty++;else cart.push({id:p.id,qty:1});updateCartCount();toast("Đã thêm vào giỏ")}
$("cartBtn").onclick=showCart;
function showCart(){const total=cart.reduce((s,x)=>{const p=products.find(p=>String(p.id)===String(x.id));return s+(p?Number(p.price)*x.qty:0)},0);const lines=cart.map(x=>{const p=products.find(p=>String(p.id)===String(x.id));if(!p)return "";return `<div class="row"><span>${esc(p.name)} × ${x.qty}</span><b>${money(p.price*x.qty)}</b><button class="ghost" onclick="removeCart('${p.id}')">Xóa</button></div>`}).join("");modal("Giỏ hàng",`${lines||"<p>Giỏ hàng trống.</p>"}<hr><p>Tổng: <b>${money(total)}</b></p>${cart.length?'<button class="btn primary" onclick="checkout()">Tạo đơn hàng</button>':""}`)}
function removeCart(id){cart=cart.filter(x=>String(x.id)!==String(id));updateCartCount();showCart()}
async function checkout(){if(!cart.length)return toast("Giỏ hàng đang trống");if(!user){toast("Đăng nhập trước khi đặt hàng");closeModal();showView("account");return}const lines=cart.map(x=>{const p=products.find(p=>String(p.id)===String(x.id));return {product_id:x.id,quantity:x.qty,unit_price:Number(p.price)}});const total=lines.reduce((s,x)=>s+x.quantity*x.unit_price,0);modal("Xác nhận đặt hàng",`<p>Tổng dự kiến: <b class="price">${money(total)}</b></p><p>Đơn sẽ ở trạng thái chờ thanh toán. Chưa thu tiền thật.</p><button class="btn primary" id="confirmOrder">Xác nhận tạo đơn</button>`);$("confirmOrder").onclick=async()=>{const {data,error}=await sb.from("orders").insert({user_id:user.id,total_amount:total,status:"pending_payment",items:lines}).select().single();if(error)return toast("Không tạo được đơn: "+error.message);cart=[];updateCartCount();closeModal();toast("Đã tạo đơn #"+data.id);showView("orders")}}
async function authRefresh(){if(!sb)return;const {data}=await sb.auth.getUser();user=data.user||null;$("sessionInfo").textContent=user?"Đã đăng nhập: "+user.email:"Chưa đăng nhập";isAdmin=false;if(user){const {data:p,error}=await sb.from("profiles").select("role").eq("id",user.id).maybeSingle();if(!error)isAdmin=p?.role==="admin"}}
$("signupBtn").onclick=async()=>{if(!$("signupEmail").value||$("signupPass").value.length<8)return toast("Nhập email hợp lệ và mật khẩu ít nhất 8 ký tự");const {error}=await sb.auth.signUp({email:$("signupEmail").value.trim(),password:$("signupPass").value});toast(error?error.message:"Đăng ký thành công. Hãy kiểm tra email để xác nhận tài khoản.")};
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPass").value});if(error)toast(error.message);else{await authRefresh();toast("Đăng nhập thành công");showView("account")}};
$("logoutBtn").onclick=async()=>{const {error}=await sb.auth.signOut();if(error)toast(error.message);else{user=null;isAdmin=false;await authRefresh();toast("Đã đăng xuất")}};
async function loadMyOrders(){if(!user){$("myOrders").textContent="Đăng nhập để xem đơn hàng.";return}const {data,error}=await sb.from("orders").select("id,total_amount,status,created_at").order("created_at",{ascending:false});$("myOrders").innerHTML=error?esc(error.message):(data||[]).map(o=>`<p>Đơn #${o.id} — ${money(o.total_amount)} — ${esc(o.status)}</p>`).join("")||"Chưa có đơn hàng."}
async function loadAdmin(){await authRefresh();$("adminStatus").textContent=isAdmin?"Đã xác thực ADMIN":"Chỉ dành cho tài khoản ADMIN";$("productForm").querySelectorAll("input,textarea,button").forEach(x=>x.disabled=!isAdmin);if(!isAdmin){$("inventory").innerHTML='<tr><td colspan="4">Bạn chưa có quyền quản trị.</td></tr>';$("allOrders").innerHTML="";return}const {data:ps,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){$("inventory").innerHTML=`<tr><td colspan="4">${esc(error.message)}</td></tr>`;return}const all=ps||[];products=all.filter(p=>p.active);render();$("inventory").innerHTML=all.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.sku)}</small></td><td>${money(p.price)}</td><td>${p.stock}</td><td><button class="btn small" onclick="editProduct('${p.id}')">Sửa</button> <button class="btn small danger" onclick="deleteProduct('${p.id}')">Ẩn</button></td></tr>`).join("");const {data:os,error:oe}=await sb.from("orders").select("id,user_id,total_amount,status").order("created_at",{ascending:false}).limit(100);$("allOrders").innerHTML=oe?`<tr><td colspan="5">${esc(oe.message)}</td></tr>`:(os||[]).map(o=>`<tr><td>${o.id}</td><td>${esc(o.user_id)}</td><td>${money(o.total_amount)}</td><td>${esc(o.status)}</td><td><select class="field" onchange="setOrderStatus('${o.id}',this.value)"><option value="pending_payment" ${o.status==="pending_payment"?"selected":""}>Chờ thanh toán</option><option value="paid" ${o.status==="paid"?"selected":""}>Đã thanh toán</option><option value="processing" ${o.status==="processing"?"selected":""}>Đang xử lý</option><option value="completed" ${o.status==="completed"?"selected":""}>Hoàn tất</option><option value="cancelled" ${o.status==="cancelled"?"selected":""}>Đã hủy</option></select></td></tr>`).join("")}
function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;$("editId").value=p.id;$("pName").value=p.name;$("pCategory").value=p.category;$("pPrice").value=p.price;$("pStock").value=p.stock;$("pSku").value=p.sku;$("pIcon").value=p.icon||"✦";$("pDesc").value=p.description||"";window.scrollTo({top:$("productForm").getBoundingClientRect().top+window.scrollY-90,behavior:"smooth"})}
$("resetProduct").onclick=()=>{$("productForm").reset();$("editId").value="";$("pIcon").value="✦"};
$("productForm").onsubmit=async e=>{e.preventDefault();if(!isAdmin||!sb)return;const p={name:$("pName").value.trim(),category:$("pCategory").value.trim(),price:Number($("pPrice").value),stock:Number($("pStock").value),sku:$("pSku").value.trim(),icon:$("pIcon").value.trim()||"✦",description:$("pDesc").value.trim(),active:true};const id=$("editId").value;const result=id?await sb.from("products").update(p).eq("id",id):await sb.from("products").insert(p);if(result.error)return toast(result.error.message);$("productForm").reset();$("editId").value="";$("pIcon").value="✦";toast("Đã lưu sản phẩm");await loadAdmin();await loadProducts()};
async function deleteProduct(id){if(!isAdmin||!confirm("Ẩn sản phẩm này khỏi cửa hàng?"))return;const {error}=await sb.from("products").update({active:false}).eq("id",id);if(error)toast(error.message);else{toast("Đã ẩn sản phẩm");await loadAdmin();await loadProducts()}}
async function setOrderStatus(id,status){if(!isAdmin)return;const {error}=await sb.from("orders").update({status}).eq("id",id);toast(error?error.message:"Đã cập nhật trạng thái")}
$("search").oninput=render;$("category").onchange=render;$("sort").onchange=render;$("year").textContent=new Date().getFullYear();
(async()=>{if(!sb){toast("Không tải được thư viện Supabase");return}sb.auth.onAuthStateChange(()=>setTimeout(authRefresh,0));await authRefresh();await loadProducts()})();
</script></body></html>
